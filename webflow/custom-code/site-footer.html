<!-- NEWS SLIDER: arrows + progress bar on tablet/phone (webflow/custom-code/news-slider.js) -->
<script>
// News / Section, every page: on tablet and phone (<=991px) add prev/next arrows and a progress
// bar under the news cards; the bar fills over 6s, then the slider advances (paused while
// touched or off screen, static with reduced motion). Same behaviour Home had via
// HomeMobileSliderKit + HomeMobileNews. Runs after the news Swiper init in the site footer.
(function () {
  if (!window.matchMedia('(max-width: 991px)').matches) return;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var de = /^de/i.test(document.documentElement.lang);
  var svg = '<svg viewBox="0 0 32 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8h27M23 2l6 6-6 6"/></svg>';
  function btn(dir, label) {
    return '<button type="button" class="m-nav_btn is-' + dir + '" aria-label="' + label + '">' + svg + '</button>';
  }
  document.querySelectorAll('.news_slider_component .swiper').forEach(function (el) {
    var sw = el.swiper;
    if (!sw || el.parentNode.querySelector('.m-nav')) return;
    var nav = document.createElement('div');
    nav.className = 'm-nav';
    nav.innerHTML = btn('prev', de ? 'Zurück' : 'Previous') +
      '<div class="m-nav_bar"><div class="m-nav_fill"></div></div>' + btn('next', de ? 'Weiter' : 'Next');
    el.parentNode.appendChild(nav);
    var fill = nav.querySelector('.m-nav_fill');
    function next() { if (sw.isEnd) sw.slideTo(0); else sw.slideNext(); }
    nav.querySelector('.is-prev').addEventListener('click', function () { sw.slidePrev(); });
    nav.querySelector('.is-next').addEventListener('click', next);
    if (reduce) { fill.style.width = '100%'; return; }
    var t0 = performance.now(), held = false, seen = true;
    sw.on('slideChange', function () { t0 = performance.now(); });
    sw.on('touchStart', function () { held = true; });
    sw.on('touchEnd', function () { held = false; });
    new IntersectionObserver(function (e) { seen = e[0].isIntersecting; }).observe(el);
    (function tick(now) {
      if (held || !seen) t0 = now;
      var p = Math.min(1, (now - t0) / 6000);
      fill.style.width = p * 100 + '%';
      if (p >= 1) { t0 = now; next(); }
      requestAnimationFrame(tick);
    })(performance.now());
  });
})();
</script>

<!-- FAQ accordion list -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".accordion_wrap").forEach((component, listIndex) => {
    if (component.dataset.scriptInitialized) return;
    component.dataset.scriptInitialized = "true";

    const closePrevious = component.getAttribute("data-close-previous") !== "false";
    const closeOnSecondClick = component.getAttribute("data-close-on-second-click") !== "false";
    const openOnHover = component.getAttribute("data-open-on-hover") === "true";
    const openByDefault = component.getAttribute("data-open-by-default") !== null && !isNaN(+component.getAttribute("data-open-by-default")) ? +component.getAttribute("data-open-by-default") : false;
		const list = component.querySelector(".accordion_list");
    let previousIndex = null,
      closeFunctions = [];

    function flattenDisplayContents(slot) {
      if (!slot) return;
      let child = slot.firstElementChild;
      while (child && child.classList.contains("u-display-contents")) {
        while (child.firstChild) {
          slot.insertBefore(child.firstChild, child);
        }
        slot.removeChild(child);
        child = slot.firstElementChild;
      }
    }
		flattenDisplayContents(list);

    function removeCMSList(slot) {
      const dynList = Array.from(slot.children).find((child) => child.classList.contains("w-dyn-list"));
      if (!dynList) return;
      const nestedItems = dynList?.querySelector(".w-dyn-items")?.children;
      if (!nestedItems) return;
      const staticWrapper = [...slot.children];
			[...nestedItems].forEach(el => { const c = [...el.children].find(c => !c.classList.contains('w-condition-invisible')); c && slot.appendChild(c); });
      staticWrapper.forEach((el) => el.remove());
    }
    removeCMSList(list);

    component.querySelectorAll(".accordion_component").forEach((card, cardIndex) => {
      const button = card.querySelector(".accordion_toggle_button");
      const content = card.querySelector(".accordion_content_wrap");

      if (!button || !content) return console.warn("Missing elements:", card);

      button.setAttribute("aria-expanded", "false");
      button.setAttribute("id", "accordion_button_" + listIndex + "_" + cardIndex);
      content.setAttribute("id", "accordion_content_" + listIndex + "_" + cardIndex);
      button.setAttribute("aria-controls", content.id);
      content.setAttribute("aria-labelledby", button.id);
      content.style.display = "none";

      const refresh = () => {
        tl.invalidate();
        if (typeof ScrollTrigger !== "undefined") ScrollTrigger.refresh();
      };
      const tl = gsap.timeline({ paused: true, defaults: { duration: 0.3, ease: "power1.inOut" }, onComplete: refresh, onReverseComplete: refresh });
      tl.set(content, { display: "block" });
      tl.fromTo(content, { height: 0 }, { height: "auto" });

      const closeAccordion = () => card.classList.contains("is-active") && (card.classList.remove("is-active"), tl.reverse(), button.setAttribute("aria-expanded", "false"));
      closeFunctions[cardIndex] = closeAccordion;

      const openAccordion = (instant = false) => {
        if (closePrevious && previousIndex !== null && previousIndex !== cardIndex) closeFunctions[previousIndex]?.();
        previousIndex = cardIndex;
        button.setAttribute("aria-expanded", "true");
        card.classList.add("is-active");
        instant ? tl.progress(1) : tl.play();
      };
      if (openByDefault === cardIndex + 1) openAccordion(true);

      card.addEventListener('click', (e) => {
        if (e.target.closest('a, button, input, textarea, select')) return;
        button.click();
      });

      button.addEventListener("click", () => (card.classList.contains("is-active") && closeOnSecondClick ? (closeAccordion(), (previousIndex = null)) : openAccordion()));
      if (openOnHover) button.addEventListener("mouseenter", () => openAccordion());
    });
  });
});
</script>
