<!-- ABOUT US REVEALS (source: webflow/custom-code/about-reveal.js) -->
<script>
// About us: GSAP reveal animations, timed per the site motion spec
// (docs/motion-spec.md) so they match the other pages.
//  - Hero (on load): the standard hero reveal. Background fades in and settles
//    from a slight zoom, eyebrow rises, heading lines rise out of a mask.
//  - Hero stats (when scrolled into view): stats fade up with a stagger, the
//    divider draws from left to right, the numbers roll into place digit by
//    digit like the Home "Über Zios" numbers (650+, 99.9%, 24/7, 15,000+, 500K+).
//  - Intro (when scrolled into view): eyebrow, title and text fade up in turn,
//    the photo uncovers from the bottom while it settles from a slight zoom.
//  - Timeline (Figma 10091:14431): the bright centre line fills down the track
//    with scroll (scrubbed); each milestone's year box opens from the centre
//    line outwards, the year rises inside it, then the text fades up.
//  - Approach and Mission (Figma 10106:15514): title and subtitle fade up;
//    per row the cards rise in turn, icons pop, copy follows, ASCII art scans in.
//  - CTA (Figma 10105:14455): title, text and button fade up in turn; the photo
//    settles from a zoom and the ASCII layer drifts with scroll.
// Elements are marked with data-ab-* attributes in Webflow. They start hidden
// via the page head CSS (only while <html> has .ab-js); this script reveals
// them, and if it can't run (no GSAP, reduced motion) it simply shows them.
// Lives in the About us page footer custom code. GSAP, ScrollTrigger and
// SplitText come from the site footer; the loader below is only a fallback.
(function () {
  var root = document.documentElement;
  window.__abReveal = true;

  function showAll() { root.classList.remove('ab-js'); }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function ensureGsap() {
    var chain = Promise.resolve();
    if (typeof window.gsap === 'undefined') {
      chain = chain.then(function () { return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js'); });
    }
    return chain.then(function () {
      if (typeof window.ScrollTrigger === 'undefined') {
        return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js');
      }
    });
  }

  // Hero headline: lines rise out of a mask, same as every hero (docs/motion-spec.md).
  function heroLines(tl, el) {
    if (!el) return;
    if (window.SplitText) {
      var split = SplitText.create(el, { type: 'lines', mask: 'lines' });
      tl.from(split.lines, { yPercent: 110, duration: 1, stagger: 0.12 }, 0.1);
      // Back to plain text afterwards so the heading re-wraps normally on resize.
      tl.eventCallback('onComplete', function () { split.revert(); });
    } else {
      tl.from(el, { y: 40, autoAlpha: 0, duration: 1 }, 0.1);
    }
  }

  var ROLL_MS = 1800, ROLL_STAGGER = 150;
  function buildRoll(el) {
    var txt = el.textContent.trim();
    if (!/\d/.test(txt)) return null;
    var cs = getComputedStyle(el), lh = parseFloat(cs.lineHeight);
    if (isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.2;
    el.setAttribute('aria-label', txt);
    el.textContent = '';
    el.style.fontVariantNumeric = 'tabular-nums';
    var k = 0, strips = [];
    txt.split('').forEach(function (ch) {
      var span = document.createElement('span');
      span.setAttribute('aria-hidden', 'true');
      if (!/\d/.test(ch)) { span.textContent = ch; el.appendChild(span); return; }
      span.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;height:' + lh + 'px;line-height:' + lh + 'px';
      var strip = document.createElement('span');
      strip.style.cssText = 'display:block;will-change:transform';
      var n = ++k * 10 + +ch, html = ''; // later digits spin more
      for (var i = 0; i <= n; i++) html += '<span style="display:block">' + (i % 10) + '</span>';
      strip.innerHTML = html;
      span.appendChild(strip);
      el.appendChild(span);
      strips.push({ strip: strip, y: -n * lh });
    });
    return strips;
  }

  function roll(strips, delay) {
    strips.forEach(function (s, i) {
      s.strip.style.transition = 'transform ' + (ROLL_MS + i * ROLL_STAGGER) + 'ms cubic-bezier(.16,1,.3,1) ' + Math.round(delay * 1000) + 'ms';
      s.strip.style.transform = 'translateY(' + s.y + 'px)';
    });
  }

  function initHero(sec) {
    var bg = sec.querySelector('.abouthero_bg');
    var eyebrow = sec.querySelectorAll('[data-ab-reveal]');
    var heading = sec.querySelector('[data-ab-split]');
    var stats = sec.querySelectorAll('[data-ab-stat]');
    var line = sec.querySelector('[data-ab-line]');
    var rolls = Array.prototype.map.call(sec.querySelectorAll('[data-ab-count]'), buildRoll).filter(Boolean);

    gsap.set([eyebrow, heading, stats, line], { autoAlpha: 1 });

    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    if (bg) tl.from(bg, { autoAlpha: 0, scale: 1.06, duration: 1.8, ease: 'power2.out' }, 0);
    tl.from(eyebrow, { y: 16, autoAlpha: 0, duration: 0.8 }, 0);
    heroLines(tl, heading);

    var statsTl = gsap.timeline({
      defaults: { ease: 'power3.out' },
      scrollTrigger: { trigger: sec.querySelector('.abouthero_stats'), start: 'top 85%', once: true }
    });
    statsTl.from(stats, { y: 32, autoAlpha: 0, duration: 0.8, stagger: 0.1 }, 0);
    if (line) statsTl.from(line, { scaleX: 0, transformOrigin: '0% 50%', duration: 1.2, ease: 'power3.inOut' }, 0.2);
    statsTl.add(function () {
      rolls.forEach(function (strips, i) { roll(strips, i * 0.12); });
    }, 0);
  }

  function initIntro(sec) {
    var eyebrow = sec.querySelector('.aboutintro_eyebrow');
    var title = sec.querySelector('[data-ab-split]');
    var text = sec.querySelector('.aboutintro_text');
    var visual = sec.querySelector('[data-ab-visual]');
    var img = visual && visual.querySelector('img');

    gsap.set([eyebrow, title, text, visual], { autoAlpha: 1 });

    var tl = gsap.timeline({
      defaults: { ease: 'power3.out' },
      scrollTrigger: { trigger: sec, start: 'top 85%', once: true }
    });
    if (visual) {
      tl.fromTo(visual, { clipPath: 'inset(100% 0% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.2, ease: 'power3.inOut' }, 0);
      if (img) tl.fromTo(img, { scale: 1.15 }, { scale: 1, duration: 1.6, ease: 'power3.out' }, 0);
    }
    tl.from([eyebrow, title, text].filter(Boolean), { y: 32, autoAlpha: 0, duration: 0.8, stagger: 0.1 }, 0.1);
  }

  function initTimeline(sec) {
    var list = sec.querySelector('.abouttl_list');
    var progress = sec.querySelector('[data-ab-tl-progress]');
    var items = sec.querySelectorAll('[data-ab-tl-item]');
    var mobile = window.matchMedia('(max-width: 767px)');

    // The bright line fills down the track as the list scrolls past the middle of the screen.
    if (progress && list) {
      gsap.fromTo(progress, { scaleY: 0 }, {
        scaleY: 1,
        ease: 'none',
        scrollTrigger: { trigger: list, start: 'top 60%', end: 'bottom 60%', scrub: 0.6 }
      });
    }

    items.forEach(function (item) {
      var box = item.querySelector('.abouttl_box');
      var year = item.querySelector('.abouttl_year');
      var text = item.querySelector('.abouttl_text');
      // Boxes open from the centre line outwards (on mobile the line is on the left, so all open to the right).
      var fromLeft = mobile.matches || item.classList.contains('is-right');
      var closed = fromLeft ? 'inset(0% 100% 0% 0%)' : 'inset(0% 0% 0% 100%)';

      gsap.set(item, { autoAlpha: 1 });
      var tl = gsap.timeline({
        defaults: { ease: 'power3.out' },
        scrollTrigger: { trigger: item, start: 'top 85%', once: true }
      });
      if (box) tl.fromTo(box, { clipPath: closed }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.2, ease: 'power3.inOut' }, 0);
      if (year) tl.from(year, { yPercent: 110, duration: 1 }, 0.45);
      if (text) tl.from(text, { y: 32, autoAlpha: 0, duration: 0.8 }, 0.6);
    });
  }

  function initApproach(sec) {
    var title = sec.querySelector('[data-ab-split]');
    var sub = sec.querySelector('.aboutappr_sub');

    gsap.set([title, sub], { autoAlpha: 1 });
    gsap.timeline({
      defaults: { ease: 'power3.out' },
      scrollTrigger: { trigger: sec, start: 'top 85%', once: true }
    })
      .from([title, sub].filter(Boolean), { y: 32, autoAlpha: 0, duration: 0.8, stagger: 0.1 }, 0);

    // Each row: its cards rise in turn; inside each card the icon pops, the copy
    // follows line by line and the ASCII art scans in from the bottom in steps.
    sec.querySelectorAll('[data-ab-appr-row]').forEach(function (row) {
      var cards = row.querySelectorAll('[data-ab-appr-card]');
      gsap.set(cards, { autoAlpha: 1 });
      var tl = gsap.timeline({
        defaults: { ease: 'power3.out' },
        scrollTrigger: { trigger: row, start: 'top 85%', once: true }
      });
      cards.forEach(function (card, i) {
        var at = i * 0.1;
        var icon = card.querySelector('.aboutappr_icon');
        var copy = card.querySelectorAll('.aboutappr_card_title, .aboutappr_card_text');
        var ascii = card.querySelector('[data-ab-appr-ascii]');
        tl.from(card, { y: 32, autoAlpha: 0, duration: 0.8 }, at);
        if (icon) tl.from(icon, { scale: 0.4, rotate: -20, autoAlpha: 0, duration: 0.8, ease: 'back.out(2)' }, at + 0.3);
        if (copy.length) tl.from(copy, { y: 32, autoAlpha: 0, duration: 0.8, stagger: 0.1 }, at + 0.2);
        if (ascii) tl.fromTo(ascii, { clipPath: 'inset(100% 0% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.4, ease: 'steps(14)' }, at + 0.35);
      });
    });
  }

  function initCta(sec) {
    var title = sec.querySelector('[data-ab-split]');
    var rest = sec.querySelectorAll('[data-ab-reveal]');
    var photo = sec.querySelector('[data-ab-cta-photo]');
    var ascii = sec.querySelector('[data-ab-cta-ascii]');

    gsap.set([title, rest], { autoAlpha: 1 });
    var tl = gsap.timeline({
      defaults: { ease: 'power3.out' },
      scrollTrigger: { trigger: sec, start: 'top 85%', once: true }
    });
    tl.from([title].concat(Array.prototype.slice.call(rest)).filter(Boolean), { y: 32, autoAlpha: 0, duration: 0.8, stagger: 0.1 }, 0);
    if (photo) tl.fromTo(photo, { scale: 1.06 }, { scale: 1, duration: 1.8, ease: 'power2.out' }, 0);

    // The ASCII layer is wider than the section; let it drift sideways as the section scrolls by.
    if (ascii) {
      gsap.fromTo(ascii, { xPercent: 0 }, {
        xPercent: -8,
        ease: 'none',
        scrollTrigger: { trigger: sec, start: 'top bottom', end: 'bottom top', scrub: 0.6 }
      });
    }
  }

  function init() {
    var hero = document.querySelector('.abouthero_sec');
    var intro = document.querySelector('.aboutintro_sec');
    var timeline = document.querySelector('.abouttl_sec');
    var approach = document.querySelector('.aboutappr_sec');
    var cta = document.querySelector('.aboutcta_sec');
    if (!hero && !intro && !timeline && !approach && !cta) return showAll();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return showAll();
    gsap.registerPlugin(ScrollTrigger);
    if (hero) initHero(hero);
    if (intro) initIntro(intro);
    if (timeline) initTimeline(timeline);
    if (approach) initApproach(approach);
    if (cta) initCta(cta);
    root.classList.remove('ab-js');
    ScrollTrigger.refresh();
  }

  function start() {
    ensureGsap()
      .then(function () { return document.fonts ? document.fonts.ready : null; })
      .then(init)
      .catch(showAll);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
