<!-- Über Zios (home-about.css) -->
<style>
.aboutus_main_wr .aboutus_number { display: inline-block; background-image: linear-gradient(87deg, var(--swatch--white-100) 9.7%, var(--swatch--blue-100) 99%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

  .aboutus_main_wr .aboutus_link_wr { grid-column: -2 / -1; justify-self: end; align-self: end; display: flex; justify-content: flex-end; padding-right: 0; margin-left: auto; }

</style>
<style>

<!-- Old expertise slider (section hidden; kept until v3 is approved) -->
<style>
.expertise_sec {
  --exp-cw: min(var(--max-width--main), 100vw - var(--site--margin) * 2);
  --exp-sw: min(var(--exp-cw), calc(100svh * 1322 / 784));
  overflow: clip;
}
.expertise_sec .expertise_tab_wr { display: flex; flex-direction: column-reverse; gap: 1.5rem; }
.expertise_sec .swiper.expertise { width: 100vw; margin-left: calc(50% - 50vw); overflow: hidden; }
.expertise_sec .swiper-slide.expertise { width: var(--exp-sw); height: auto; aspect-ratio: 1322 / 784; }
.expertise_sec .expertise_card_wr { position: relative; height: 100%; overflow: hidden; background-color: var(--swatch--blue-180); }
.expertise_sec .expertise_card_inner { position: relative; height: 100%; padding: 3.125rem; display: flex; flex-direction: column; justify-content: space-between; }
.expertise_sec .expertise_card_visual { position: absolute; inset: 0; z-index: 0; margin: 0; }
.expertise_sec .expertise_card_visual > * { width: 100%; height: 100%; object-fit: cover; }
.expertise_sec .expertise_card_header_wr, .expertise_sec .expertise_card_bottom { position: relative; z-index: 1; }
.expertise_sec .expertise_card_title { font-size: var(--_typography---font-size--h4); font-weight: 400; line-height: 1.3; color: var(--swatch--white-100); }
.expertise_sec .expertise_card_subheader_text { margin-top: 1.25rem; max-width: 27.5rem; text-transform: uppercase; font-weight: 400; color: var(--swatch--blue-30); }
.expertise_sec .expertise_card_bottom { align-self: flex-end; max-width: 38rem; gap: 1.875rem; }
.expertise_sec .expertise_card_text { font-size: var(--_typography---font-size--h7); font-weight: 400; line-height: 1.3; color: var(--swatch--white-100); }
.expertise_sec .expertise_card_wr.is-3 { background-color: var(--swatch--light-200); }
.expertise_sec .expertise_card_wr.is-3 .expertise_card_title { color: var(--blue-160-2-0); }
.expertise_sec .expertise_card_wr.is-3 .expertise_card_subheader_text,
.expertise_sec .expertise_card_wr.is-3 .expertise_card_text { color: var(--swatch--blue-130); }
.expertise_sec .expertise_nav_wr { position: absolute; inset: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; width: auto; margin: 0; padding: 0 calc((100vw - var(--exp-sw)) / 2 - 1.6875rem); pointer-events: none; }
.expertise_sec .expertise_nav_btn { pointer-events: auto; cursor: pointer; }
.expertise_sec .expertise_tab_button_list { display: flex; gap: 1rem; width: var(--exp-sw); margin-left: auto; margin-right: auto; padding: 0; overflow: visible; }
.expertise_sec .tab_button_item { position: relative; flex: 1 1 0%; display: flex; align-items: center; justify-content: center; min-height: 2.3125rem; padding: 0.5rem 1.5rem; overflow: hidden; background-color: var(--swatch--blue-60); }
.expertise_sec .tab_button_text { position: relative; z-index: 1; font-size: var(--_typography---font-size--h6); font-weight: 500; line-height: 1.3; color: var(--swatch--blue-130); text-transform: capitalize; }
.expertise_sec .tab_button_line { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background-image: linear-gradient(90deg, var(--swatch--blue-100) 60%, var(--swatch--white-100)); }
.expertise_sec .tab_button_item.is-active .tab_button_line { animation: expertise-progress var(--expertise-autoplay, 6000ms) linear forwards; }
@keyframes expertise-progress { from { width: 0; } to { width: 100%; } }
@media screen and (max-width: 767px) {
  .expertise_sec .swiper-slide.expertise { width: var(--exp-cw); aspect-ratio: auto; min-height: 32rem; }
  .expertise_sec .expertise_tab_button_list { width: var(--exp-cw); }
  .expertise_sec .expertise_card_inner { padding: 1.5rem; }
  .expertise_sec .expertise_tab_button_list { gap: 0.5rem; }
  .expertise_sec .tab_button_item { padding: 0.5rem; }
  .expertise_sec .tab_button_text { font-size: var(--_typography---font-size--h9); }
}
@media (prefers-reduced-motion: reduce) {
  .expertise_sec .tab_button_item.is-active .tab_button_line { animation: none; width: 100%; }
}
</style>
<!-- Reviews: static 3 cards, cut corner, gradient + hover (home-reviews.css) -->
<style>
.reviews_card_bg { clip-path: polygon(0 0, calc(100% - 3.5625rem) 0, 100% 3.5625rem, 100% 100%, 0 100%); }
.reviews_card_fill { clip-path: polygon(0 0, calc(100% - 3.4625rem) 0, 100% 3.4625rem, 100% 100%, 0 100%); background-image: linear-gradient(90deg, var(--swatch--blue-30) 0%, color-mix(in srgb, var(--swatch--blue-30) 30%, var(--swatch--blue-10)) 87%); }
.reviews_card_hover { background-image: linear-gradient(115deg, color-mix(in srgb, var(--swatch--blue-60) 55%, transparent) 0%, color-mix(in srgb, var(--swatch--blue-60) 0%, transparent) 70%); transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
@media (hover: hover) {
  .reviews_card:hover .reviews_card_hover { opacity: 1; }
}
.reviews_card:focus-within .reviews_card_hover { opacity: 1; }
.reviews_card_text::before { content: "\201C"; }
.reviews_card_text::after { content: "\201D"; }
@media (prefers-reduced-motion: reduce) {
  .reviews_card_hover { transition: none; }
}
</style>
