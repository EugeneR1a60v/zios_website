<!-- Features section (capability-features.js) -->
<script>
// "What can I do" section (features_sec): tabs on desktop, accordion on mobile, GSAP motion.
// Replaces the old data-feature/data-feature-panel script: each title now drives the panel in its
// own CMS item, so pairing can't break when a binding is empty.
// - Switching: the outgoing panel fades out completely before the incoming one staggers in
//   (image, lead, paragraphs), so two panels never overlap.
// - Hover (mouse, 768px+): resting on a title for a moment opens it; click/tap/keyboard also work.
// - Scroll reveal: heading, then the titles one after another, then the open panel's content.
// - Without GSAP (or with reduced motion) it still switches, just without animation.
// Lives in the page footer of Capabilities (Template) and the Leistungsbereiche CMS template;
// CSS in capability-features.css (page head).
(function () {
  var HOVER_DELAY = 90;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var desktopMq = window.matchMedia('(min-width: 768px)');
  var hoverMq = window.matchMedia('(hover: hover) and (pointer: fine)');

  function loadGsap() {
    if (window.gsap) return Promise.resolve(window.gsap);
    var tag = document.querySelector('script[src*="gsap.min.js"]');
    if (!tag) {
      tag = document.createElement('script');
      tag.src = 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js';
      document.head.appendChild(tag);
    }
    // Another script (e.g. the hero reveal) may already be loading it: wait for window.gsap.
    return new Promise(function (resolve, reject) {
      var tries = 0;
      (function check() {
        if (window.gsap) return resolve(window.gsap);
        if (++tries > 100) return reject();
        setTimeout(check, 50);
      })();
    });
  }

  function init(sec) {
    var list = sec.querySelector('.features_list');
    if (!list) return;
    var items = [].slice.call(list.querySelectorAll(':scope > .features_item'));
    if (!items.length) return;
    var heading = sec.querySelector('.features_contain > .features_content_heading');
    var gsap = null;
    var active = -1;
    var hoverTimer = null;

    function parts(i) {
      var it = items[i];
      return {
        item: it,
        btn: it.querySelector('.features_title_wr'),
        wr: it.querySelector('.features_content_wr'),
        panel: it.querySelector('.features_content_panel')
      };
    }
    function kids(p) {
      var rt = p.wr && p.wr.querySelector('.features_content_panel .features__RT');
      return rt ? [].slice.call(rt.children) : [];
    }

    list.style.setProperty('--features-count', items.length);
    items.forEach(function (it, i) {
      var p = parts(i);
      if (!p.btn || !p.wr) return;
      var id = 'features-panel-' + i;
      p.wr.id = id;
      p.btn.setAttribute('type', 'button');
      p.btn.setAttribute('aria-controls', id);
      p.btn.setAttribute('aria-expanded', 'false');
      p.btn.addEventListener('click', function () { activate(i, true); });
      p.btn.addEventListener('pointerenter', function (e) {
        if (e.pointerType !== 'mouse' || !hoverMq.matches || !desktopMq.matches) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { activate(i, true); }, HOVER_DELAY);
      });
      p.btn.addEventListener('pointerleave', function () { clearTimeout(hoverTimer); });
    });

    function setClasses(i, on) {
      var p = parts(i);
      [p.item, p.btn, p.panel].forEach(function (el) { if (el) el.classList.toggle('is-active', on); });
      if (p.btn) p.btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    }

    // Inline state for every panel, used once GSAP owns visibility.
    function syncInline() {
      if (!gsap) return;
      items.forEach(function (it, i) {
        var p = parts(i);
        if (!p.wr) return;
        gsap.killTweensOf(p.wr);
        gsap.killTweensOf(kids(p));
        gsap.set(kids(p), { clearProps: 'transform,opacity,visibility' });
        gsap.set(p.wr, { clearProps: 'height' });
        it.classList.remove('is-closing');
        gsap.set(p.wr, { autoAlpha: i === active ? 1 : 0 });
      });
    }

    function activate(i, animate) {
      if (i === active) return;
      var prev = active;
      active = i;
      var next = parts(i);
      var anim = animate && gsap && !reduce;

      if (gsap) {
        // Stop anything mid-flight and hide every panel that is not involved in this switch.
        items.forEach(function (it, k) {
          var p = parts(k);
          if (!p.wr) return;
          gsap.killTweensOf(p.wr);
          gsap.killTweensOf(kids(p));
          if (k !== prev || !anim) {
            gsap.set(p.wr, { autoAlpha: k === i ? 1 : 0, clearProps: 'height' });
            gsap.set(kids(p), { clearProps: 'transform,opacity,visibility' });
            if (k !== prev) it.classList.remove('is-closing');
          }
        });
      }

      if (prev > -1) setClasses(prev, false);
      setClasses(i, true);
      if (!anim || !next.wr) {
        if (prev > -1) items[prev].classList.remove('is-closing');
        return;
      }

      var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      var prevP = prev > -1 ? parts(prev) : null;
      var content = kids(next);

      if (desktopMq.matches) {
        gsap.set(next.wr, { autoAlpha: 0 });
        if (prevP && prevP.wr) tl.to(prevP.wr, { autoAlpha: 0, duration: 0.18, ease: 'power1.out' });
        tl.set(next.wr, { autoAlpha: 1 });
        tl.fromTo(content, { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, stagger: 0.08 });
      } else {
        // Accordion: close the old item, open the new one with its content staggering in.
        if (prevP && prevP.wr) {
          prevP.item.classList.add('is-closing');
          gsap.set(prevP.wr, { autoAlpha: 1 });
          tl.to(prevP.wr, {
            height: 0, duration: 0.35, ease: 'power2.inOut',
            onComplete: function () {
              prevP.item.classList.remove('is-closing');
              gsap.set(prevP.wr, { clearProps: 'height', autoAlpha: 0 });
            }
          }, 0);
        }
        gsap.set(next.wr, { autoAlpha: 1 });
        tl.fromTo(next.wr, { height: 0 }, { height: 'auto', duration: 0.4, ease: 'power2.inOut', clearProps: 'height' }, 0);
        tl.fromTo(content, { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, stagger: 0.07 }, 0.15);
      }
      tl.eventCallback('onComplete', function () {
        if (window.ScrollTrigger) window.ScrollTrigger.refresh();
      });
    }

    activate(0, false);
    list.classList.add('is-init');

    if (reduce) return;
    loadGsap().then(function (g) {
      gsap = g;
      syncInline();
      if (desktopMq.addEventListener) desktopMq.addEventListener('change', syncInline);
      reveal();
    }).catch(function () {});

    function reveal() {
      // Already on screen (e.g. reload mid-page): leave it as is.
      var r = (heading || list).getBoundingClientRect();
      if (!('IntersectionObserver' in window) || r.top < window.innerHeight * 0.85) return;
      var titles = items.map(function (it) { return it.querySelector('.features_title'); }).filter(Boolean);
      var open = kids(parts(active));
      var targets = [heading].concat(titles, open).filter(Boolean);
      gsap.set(targets, { autoAlpha: 0, y: 32 });
      var io = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        io.disconnect();
        var tl = gsap.timeline({ defaults: { ease: 'power3.out', duration: 0.8 } });
        if (heading) tl.to(heading, { autoAlpha: 1, y: 0 }, 0);
        tl.to(titles, { autoAlpha: 1, y: 0, stagger: 0.07 }, 0.15);
        tl.to(open, { autoAlpha: 1, y: 0, stagger: 0.1 }, 0.3);
        tl.eventCallback('onComplete', function () {
          gsap.set(targets, { clearProps: 'transform,opacity,visibility' });
        });
      }, { rootMargin: '0px 0px -15% 0px' });
      io.observe(list);
    }
  }

  function start() { document.querySelectorAll('.features_sec').forEach(init); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- What can I do, static version (capability-cando.js) -->
<script>
// "What can I do", static version (cando_sec): tabs on desktop, accordion on mobile, GSAP motion.
// Tab n opens panel n (same order in the markup). Classes: .is-active on the tab and its panel.
// - Scroll reveal: heading, then the titles one after another, then the open panel
//   (image wipes in from the top, lead and paragraphs rise in staggered).
// - Switching: the old panel fades out before the new one plays the same reveal, so two panels never overlap.
// - Hover (mouse, 768px+): resting on a title for a moment opens it; click, tap, Enter and Space also work.
// - Mobile: the old panel collapses while the new one opens under its title.
// - Without GSAP or with reduced motion it still switches, just without animation.
// Lives in the Capabilities (Template) page footer; CSS in capability-cando.css (page head).
(function () {
  var HOVER_DELAY = 90;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var desktopMq = window.matchMedia('(min-width: 768px)');
  var hoverMq = window.matchMedia('(hover: hover) and (pointer: fine)');

  function loadGsap() {
    if (window.gsap) return Promise.resolve(window.gsap);
    if (!document.querySelector('script[src*="gsap.min.js"]')) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js';
      document.head.appendChild(s);
    }
    // Another script (e.g. the hero reveal) may already be loading it: wait for window.gsap.
    return new Promise(function (resolve, reject) {
      var tries = 0;
      (function check() {
        if (window.gsap) return resolve(window.gsap);
        if (++tries > 100) return reject();
        setTimeout(check, 50);
      })();
    });
  }

  function init(sec) {
    var layout = sec.querySelector('.cando_layout');
    if (!layout) return;
    var tabs = [].slice.call(layout.querySelectorAll(':scope > .cando_tab'));
    var panels = [].slice.call(layout.querySelectorAll(':scope > .cando_panel'));
    var count = Math.min(tabs.length, panels.length);
    if (!count) return;
    var heading = sec.querySelector('.cando_heading');
    var gsap = null;
    var active = -1;
    var hoverTimer = null;

    function img(i) { return panels[i].querySelector('.cando_panel_img'); }
    function texts(i) {
      var body = panels[i].querySelector('.cando_panel_body');
      return body ? [].slice.call(body.children) : [];
    }
    function kids(i) { return [img(i)].concat(texts(i)).filter(Boolean); }

    for (var k = 0; k < count; k++) (function (i) {
      var tab = tabs[i], panel = panels[i];
      panel.id = panel.id || 'cando-panel-' + i;
      tab.setAttribute('role', 'button');
      tab.setAttribute('tabindex', '0');
      tab.setAttribute('aria-controls', panel.id);
      tab.removeAttribute('type');
      tab.addEventListener('click', function (e) { e.preventDefault(); activate(i, true); });
      tab.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(i, true); }
      });
      tab.addEventListener('pointerenter', function (e) {
        if (e.pointerType !== 'mouse' || !hoverMq.matches || !desktopMq.matches) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () { activate(i, true); }, HOVER_DELAY);
      });
      tab.addEventListener('pointerleave', function () { clearTimeout(hoverTimer); });
    })(k);

    function setActive(i, on) {
      tabs[i].classList.toggle('is-active', on);
      panels[i].classList.toggle('is-active', on);
      tabs[i].setAttribute('aria-expanded', on ? 'true' : 'false');
    }

    function resetAll() {
      for (var i = 0; i < count; i++) {
        gsap.killTweensOf([panels[i]].concat(kids(i)));
        gsap.set(kids(i), { clearProps: 'transform,opacity,visibility,clipPath' });
        gsap.set(panels[i], { clearProps: 'height' });
        panels[i].classList.remove('is-closing');
        gsap.set(panels[i], { autoAlpha: i === active ? 1 : 0 });
      }
    }

    // The open panel's content: image wipes down, text rises in one after another.
    function revealContent(tl, i, at) {
      var im = img(i);
      if (im) tl.fromTo(im, { clipPath: 'inset(0% 0% 100% 0%)' },
        { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.9, ease: 'power3.inOut' }, at);
      tl.fromTo(texts(i), { y: 24, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, stagger: 0.08 }, im ? '<0.2' : at);
    }

    function activate(i, animate) {
      if (i === active) return;
      var prev = active;
      active = i;
      var anim = animate && gsap && !reduce;

      for (var j = 0; j < count; j++) setActive(j, j === i);
      if (!gsap) return;

      // Stop anything mid-flight; every panel except the outgoing one goes straight to its end state.
      for (var p = 0; p < count; p++) {
        gsap.killTweensOf([panels[p]].concat(kids(p)));
        if (p !== prev || !anim) {
          gsap.set(kids(p), { clearProps: 'transform,opacity,visibility,clipPath' });
          gsap.set(panels[p], { clearProps: 'height', autoAlpha: p === i ? 1 : 0 });
          panels[p].classList.remove('is-closing');
        }
      }
      if (!anim) return;

      var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
      if (desktopMq.matches) {
        gsap.set(panels[i], { autoAlpha: 0 });
        if (prev > -1) tl.to(panels[prev], { autoAlpha: 0, duration: 0.18, ease: 'power1.out' });
        tl.set(panels[i], { autoAlpha: 1 });
        revealContent(tl, i, '>');
      } else {
        if (prev > -1) {
          var old = panels[prev];
          old.classList.add('is-closing');
          gsap.set(old, { autoAlpha: 1 });
          tl.to(old, {
            height: 0, duration: 0.35, ease: 'power2.inOut',
            onComplete: function () {
              old.classList.remove('is-closing');
              gsap.set(old, { clearProps: 'height', autoAlpha: 0 });
            }
          }, 0);
        }
        gsap.set(panels[i], { autoAlpha: 1 });
        tl.fromTo(panels[i], { height: 0 }, { height: 'auto', duration: 0.4, ease: 'power2.inOut', clearProps: 'height' }, 0);
        revealContent(tl, i, 0.1);
      }
      tl.eventCallback('onComplete', function () {
        if (window.ScrollTrigger) window.ScrollTrigger.refresh();
      });
    }

    activate(0, false);
    if (reduce) return;

    loadGsap().then(function (g) {
      gsap = g;
      resetAll();
      if (desktopMq.addEventListener) desktopMq.addEventListener('change', resetAll);
      reveal();
    }).catch(function () {});

    function reveal() {
      // Already on screen (e.g. reload mid-page): leave it as is.
      var r = (heading || layout).getBoundingClientRect();
      if (!('IntersectionObserver' in window) || r.top < window.innerHeight * 0.85) return;
      var titles = tabs.map(function (t) { return t.querySelector('.cando_tab_title'); }).filter(Boolean);
      var im = img(active);
      var txt = texts(active);
      gsap.set([heading].concat(titles, txt).filter(Boolean), { autoAlpha: 0, y: 32 });
      if (im) gsap.set(im, { clipPath: 'inset(0% 0% 100% 0%)' });
      var io = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        io.disconnect();
        var tl = gsap.timeline({ defaults: { ease: 'power3.out', duration: 0.8 } });
        if (heading) tl.to(heading, { autoAlpha: 1, y: 0 }, 0);
        tl.to(titles, { autoAlpha: 1, y: 0, stagger: 0.07 }, 0.15);
        if (im) tl.to(im, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1, ease: 'power3.inOut' }, 0.25);
        tl.to(txt, { autoAlpha: 1, y: 0, stagger: 0.1 }, 0.45);
        tl.eventCallback('onComplete', function () {
          gsap.set([heading, im].concat(titles, txt).filter(Boolean), { clearProps: 'transform,opacity,visibility,clipPath' });
        });
      }, { rootMargin: '0px 0px -15% 0px' });
      io.observe(layout);
    }
  }

  function start() { document.querySelectorAll('.cando_sec').forEach(init); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- Versioned in strawberryjohn/zios_website: webflow/custom-code/ -->
<script>
// Capabilities hero: GSAP stagger reveal on load, same as the What we do hero (wwd-hero-reveal).
// Eyebrow rises in, heading lines slide up out of a mask one after another, then the lead text and
// the CTA rise in; the background layers fade in underneath. Elements stay hidden
// (html.cap-reveal-pending, set in the page head) until the timeline has set its start state; the
// head script un-hides them after 3s if GSAP never loads. Reduced motion: no animation.
// Lives in the Capabilities (Template) page footer custom code.
(function () {
  var d = document.documentElement;
  var hero = document.querySelector('.wwdhero_sec');
  function show() { d.classList.remove('cap-reveal-pending'); }
  if (!hero || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  var chain = Promise.resolve();
  if (typeof window.gsap === 'undefined') {
    chain = chain.then(function () { return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js'); });
  }
  chain = chain.then(function () {
    // SplitText needs a 3.13+ core; with an older gsap already on the page, reveal the heading whole.
    var v = (window.gsap.version || '0').split('.').map(Number);
    var newEnough = v[0] > 3 || (v[0] === 3 && v[1] >= 13);
    if (typeof window.SplitText === 'undefined' && newEnough) {
      return loadScript('https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js').catch(function () {});
    }
  });
  chain.then(function () { return document.fonts ? document.fonts.ready : null; }).then(run).catch(show);

  function run() {
    var gsap = window.gsap;
    var eyebrow = hero.querySelector('.wwdhero_head .why_eyebrow');
    var heading = hero.querySelector('.wwdhero_heading');
    var text = hero.querySelector('.wwdhero_text');
    var btn = hero.querySelector('.wwdhero_content .button_primary_wrap');
    var bgs = hero.querySelectorAll('.wwdhero_bg');
    var split = null;

    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    if (bgs.length) tl.from(bgs, { autoAlpha: 0, scale: 1.06, duration: 1.8, ease: 'power2.out' }, 0);
    if (eyebrow) tl.from(eyebrow, { y: 16, autoAlpha: 0, duration: 0.8 }, 0);
    if (heading && window.SplitText) {
      gsap.registerPlugin(window.SplitText);
      split = window.SplitText.create(heading, { type: 'lines', mask: 'lines', linesClass: 'wwdhero_line' });
      tl.from(split.lines, { yPercent: 110, duration: 1, stagger: 0.12 }, 0.1);
    } else if (heading) {
      tl.from(heading, { y: 40, autoAlpha: 0, duration: 1 }, 0.1);
    }
    tl.from([text, btn].filter(Boolean), { y: 24, autoAlpha: 0, duration: 0.8, stagger: 0.12 }, '-=0.6');
    // Back to plain text afterwards so the heading re-wraps normally on resize.
    if (split) tl.eventCallback('onComplete', function () { split.revert(); });
    show();
  }
})();
</script>
<script>
// Partners marquee (Capabilities page): one transform on the whole track instead of a separate
// CSS animation per logo group, so the groups can never drift apart.
// - Loop length = measured distance from group 1 to group 2 (includes the real gap), so the wrap
//   point lands exactly on an identical frame: no visible reset.
// - Enough groups are cloned to cover the screen width plus one loop.
// - Hover eases the whole track down to 25% speed and back, instead of pausing one group.
// Speed matches the old CSS: one group width per 40s. Reduced motion: static.
// Lives in the Capabilities (Template) page footer custom code; CSS in capability-partners-marquee.css.
(function () {
  var SECONDS_PER_LOOP = 40, HOVER_RATE = 0.25, EASE = 4;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function init(track) {
    var groups = track.querySelectorAll(':scope > .partners_list_wrap');
    if (groups.length < 2) return;
    track.classList.add('is-js-marquee');
    if (reduce) return;

    var period = 0, x = 0, rate = 1, target = 1, last = 0, visible = true;
    var host = track.parentElement;

    function measure() {
      var g = track.querySelectorAll(':scope > .partners_list_wrap');
      period = g[1].getBoundingClientRect().left - g[0].getBoundingClientRect().left;
      if (period <= 0) return;
      // Cover the visible width plus one loop so the right edge never runs out of logos.
      while (g.length * period < host.clientWidth + 2 * period) {
        var clone = g[g.length - 1].cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
        g = track.querySelectorAll(':scope > .partners_list_wrap');
      }
      x = x % period;
    }

    function frame(now) {
      var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      if (visible && period > 0) {
        rate += (target - rate) * Math.min(1, dt * EASE);
        x -= (period / SECONDS_PER_LOOP) * rate * dt;
        if (x <= -period) x += period;
        track.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
      }
      requestAnimationFrame(frame);
    }

    measure();
    // Logo widths change once images load or fonts/breakpoints change.
    if (window.ResizeObserver) new ResizeObserver(measure).observe(groups[0]);
    window.addEventListener('load', measure);
    window.addEventListener('resize', measure);
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (e) { visible = e[0].isIntersecting; }).observe(host);
    }
    host.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') target = HOVER_RATE; });
    host.addEventListener('pointerleave', function () { target = 1; });
    requestAnimationFrame(frame);
  }

  function start() {
    document.querySelectorAll('.partners_component').forEach(init);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- Capabilities "Why" stats: rolling counter (versioned in webflow/custom-code/capability-stats-roll.js) -->
<script>
// Numbers roll into place digit by digit when the stats scroll into view: the same
// counter as the Home "Über Zios" numbers and the About us stats (docs/motion-spec.md).
// Every digit is a 0-9 strip that slides up to its target like a mechanical counter;
// later digits spin more and settle a little later. Symbols ($ . % , +) and words stay
// put. Screen readers get the plain value. Reduced motion: numbers stay static.
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ROLL_MS = 1800, ROLL_STAGGER = 150, ITEM_STAGGER = 0.12;

  function buildRoll(el) {
    var txt = el.textContent.trim();
    if (!/\d/.test(txt)) return null;
    var cs = getComputedStyle(el), lh = parseFloat(cs.lineHeight);
    if (isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.2;
    el.setAttribute('aria-label', txt);
    el.textContent = '';
    el.style.fontVariantNumeric = 'tabular-nums';
    var k = 0, strips = [];
    txt.split('').forEach(function (ch) {
      var span = document.createElement('span');
      span.setAttribute('aria-hidden', 'true');
      if (!/\d/.test(ch)) { span.textContent = ch; el.appendChild(span); return; }
      span.style.cssText = 'display:inline-block;overflow:hidden;vertical-align:top;height:' + lh + 'px;line-height:' + lh + 'px';
      var strip = document.createElement('span');
      strip.style.cssText = 'display:block;will-change:transform';
      var n = ++k * 10 + +ch, html = ''; // later digits spin more
      for (var i = 0; i <= n; i++) html += '<span style="display:block">' + (i % 10) + '</span>';
      strip.innerHTML = html;
      span.appendChild(strip);
      el.appendChild(span);
      strips.push({ strip: strip, y: -n * lh });
    });
    return strips;
  }

  function roll(strips, delay) {
    strips.forEach(function (s, i) {
      s.strip.style.transition = 'transform ' + (ROLL_MS + i * ROLL_STAGGER) + 'ms cubic-bezier(.16,1,.3,1) ' + Math.round(delay * 1000) + 'ms';
      s.strip.style.transform = 'translateY(' + s.y + 'px)';
    });
  }

  function init() {
    if (!('IntersectionObserver' in window)) return;
    var groups = new Map();
    document.querySelectorAll('.why_stat_number, .why_stat_title').forEach(function (el) {
      if (!el.offsetParent || el.classList.contains('w-dyn-bind-empty')) return; // hidden or empty CMS field
      var host = el.closest('section') || el.parentNode;
      if (!groups.has(host)) groups.set(host, []);
      groups.get(host).push(el);
    });
    groups.forEach(function (els, host) {
      var rolls = els.map(buildRoll).filter(Boolean);
      if (!rolls.length) return;
      var io = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        io.disconnect();
        rolls.forEach(function (strips, i) { roll(strips, i * ITEM_STAGGER); });
      }, { rootMargin: '0px 0px -15% 0px' });
      io.observe(host);
    });
  }

  function start() { (document.fonts ? document.fonts.ready : Promise.resolve()).then(init); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
